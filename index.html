<!doctype html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Title -->
  <title>
    Chota Se Bada | Video Editing, Branding, Web Development & Social Media Agency
  </title>

  <!-- SEO -->
  <meta
    name="description"
    content="Chota Se Bada is a creative agency offering video editing, website development, branding, social media management, content creation, digital marketing, and creator management services across India."
  />

  <meta
    name="keywords"
    content="Chota Se Bada, video editing agency, website development, branding agency, social media management, digital marketing, content creation, creator management, graphic design, India"
  />

  <meta name="author" content="Chota Se Bada" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#F97316" />

  <!-- Canonical -->
  <link rel="canonical" href="https://chotasebada.in/" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Chota Se Bada" />
  <meta
    property="og:description"
    content="Creative agency specializing in video editing, branding, websites, social media management, content creation, and creator growth."
  />
  <meta property="og:url" content="https://chotasebada.in/" />
  <meta property="og:site_name" content="Chota Se Bada" />

  <!-- Replace with your actual image -->
  <meta
    property="og:image"
    content="https://chotasebada.in/og-image.jpg"
  />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Chota Se Bada" />
  <meta
    name="twitter:description"
    content="Video Editing • Branding • Web Development • Social Media Management"
  />
  <meta
    name="twitter:image"
    content="https://chotasebada.in/og-image.jpg"
  />

</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
